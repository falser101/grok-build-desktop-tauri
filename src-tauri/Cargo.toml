[package]
name = "grok-build-desktop-tauri"
version = "0.1.0"
description = "Tauri 2 desktop client for Grok Build (ACP over agent serve)"
authors = ["falser101"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "grok_build_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"

# HTTP for provider usage queries (MiniMax / DeepSeek).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Random / hex / process utilities
rand = "0.8"
which = "7"
once_cell = "1"

# Config files
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
